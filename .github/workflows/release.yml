name: release

# Push a tag like v0.3.0 to build gachaos for Windows, macOS and Linux and
# publish a GitHub Release with the files attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.3.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/gachaos.exe "dist/gachaos-$v-windows-x64.exe"
          New-Item -ItemType Directory -Force pkg/gachaos | Out-Null
          Copy-Item target/release/gachaos.exe pkg/gachaos/gachaos.exe
          Copy-Item README.md, docs/QA.md pkg/gachaos/
          Compress-Archive -Path pkg/gachaos -DestinationPath "dist/gachaos-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build a universal app and dmg
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app,dmg
      - name: Package
        run: |
          v="${TAG#v}"
          b=target/universal-apple-darwin/release/bundle
          mkdir -p dist
          cp "$b"/dmg/*.dmg "dist/gachaos-$v-macos-universal.dmg"
          ditto -c -k --keepParent "$b/macos/gachaos.app" "dist/gachaos-$v-macos-universal.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  linux:
    # The oldest supported runner, so the AppImage runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: System libraries for the webview, tray and AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test
      - name: Build AppImage and deb
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb
      - name: Package
        run: |
          v="${TAG#v}"
          b=target/release/bundle
          mkdir -p dist
          cp "$b"/appimage/*.AppImage "dist/gachaos-$v-linux-x86_64.AppImage"
          cp "$b"/deb/*.deb "dist/gachaos-$v-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          [ -f "$notes" ] || { echo "Release $TAG" > /tmp/notes.md; notes=/tmp/notes.md; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "gachaos $TAG" --notes-file "$notes"
          fi
